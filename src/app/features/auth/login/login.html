<form (ngSubmit)="onLogin()">
  <input 
    type="email" 
    placeholder="Email" 
    [(ngModel)]="email"
    name="email"
    required
  />
  <input 
    type="password" 
    placeholder="Password" 
    [(ngModel)]="password"
    name="password"
    required
  />
  <button type="submit" [disabled]="isLoading()">
    {{ isLoading() ? 'Validando...' : 'Ingresar' }}
  </button>
  
  @if (errorMessage()) {
    <p class="error">{{ errorMessage() }}</p>
  }
</form>
