<div class="flex flex-col items-center justify-center min-h-screen bg-gray-200">

  <div class="w-full max-w-md flex flex-col items-center bg-white rounded-lg shadow-md">

    <div class='flex flex-col items-center text-center p-5'>
      <h1 class="flex justify-center text-2xl font-bold mb-4 text-black">
        Iniciar Sesión
      </h1>
    </div>

    <form (ngSubmit)="onLogin()" class="p-8 w-full max-w-md">
      <div class="mb-4">
        <div class="flex flex-col mb-4">
          <label class="block mb-2 font-bold text-sm">email</label>
          <input class="w-full p-3 border border-gray-300 rounded-l-md hover:border-gray-400 transition-colors"
            type="email" placeholder="Email" [(ngModel)]="email" name="email" required />
        </div>

        <div class="flex flex-col mb-4">
          <label class="block mb-2 font-bold text-sm">Password</label>
          <div class="flex flex-row">
            <input
              class="w-full p-3 border border-gray-300 rounded-l-md border-r-0 hover:border-gray-400 transition-colors"
              [type]="showPassword ? 'text' : 'password'" placeholder="Password" [(ngModel)]="password" name="password"
              required />
            <button
              class='flex items-center justify-center px-3 bg-gray-200 border border-gray-300 border-l-0 rounded-r-md hover:bg-gray-300 transition-colors'
              type="button" (click)="setShowPassword(!showPassword)">
              @if (!showPassword) {
              <app-icon type="eyeOpen"></app-icon>
              } @else {
              <app-icon type="eyeClosed"></app-icon>
              }
            </button>
          </div>
        </div>
      </div>

      <button class="w-full bg-blue-500 text-white p-2 text-md font-bold rounded-md hover:bg-blue-600 transition-colors"
        type="submit" [disabled]="isLoading()">
        {{ isLoading() ? 'Validando...' : 'Ingresar' }}
      </button>

      @if (errorMessage()) {
      <p class="error">{{ errorMessage() }}</p>
      }
    </form>

  </div>


</div>
